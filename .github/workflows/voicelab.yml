name: voicelab
on:
  push:
    branches: [voice-lab]
    paths: ['voicelab/request.json']
permissions:
  contents: write
concurrency:
  group: voicelab
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: generate
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 voicelab/run.py
      - name: commit results
        run: |
          git config user.name "voicelab"
          git config user.email "voicelab@users.noreply.github.com"
          git add -A voicelab
          git commit -m "voicelab: results" || echo "nothing to commit"
          git push
