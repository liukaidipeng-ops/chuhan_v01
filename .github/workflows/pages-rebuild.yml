# 每次推送到 main 后，请 GitHub Pages 按最新的 main 重新构建网站
name: 重建网站
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: 请求 Pages 重新构建
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
