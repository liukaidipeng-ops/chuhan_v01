<div class="wrap">
  <h1>楚汉兵卒 · 三套造型</h1>
  <p class="lead">082 你说兵和卒要重新设计、楚汉步兵造型要不一样。三套方案，每套左边汉兵、右边楚卒，原地慢慢转着看。都是同一副骨架（加了膝、肘，就是对打动画用的那一副），选定哪套就直接套进对打里，四级金甲斩马刀手另做。</p>

  <div class="grid">
    <figure><canvas id="cv_a"></canvas><div class="tag"><span>汉兵</span><span>楚卒</span></div><figcaption><b>甲 · 札甲对犀甲</b><span>照秦汉出土的样子：汉兵红襦外罩黑漆札甲、红绳穿甲片，头裹赤帻，长方木盾；楚卒黑袍外披赭红犀皮甲、黄漆云带，高髻插两根鹖羽，持戟，黑漆长盾上画朱黄圈纹。</span></figcaption></figure>
    <figure><canvas id="cv_b"></canvas><div class="tag"><span>汉兵</span><span>楚卒</span></div><figcaption><b>乙 · 盔胄对巾帻</b><span>远看剪影就分得开：汉兵铁盔顶一簇红缨、红长袍到膝、宽黑腰带，长方红盾；楚卒不戴盔，黑巾裹头、两条巾尾拖在脑后，无袖皮背心露出两臂，黑圆盾上画红黑圈纹，持戟。</span></figcaption></figure>
    <figure><canvas id="cv_c"></canvas><div class="tag"><span>汉兵</span><span>楚卒</span></div><figcaption><b>丙 · 重甲对轻装</b><span>一重一轻：汉兵铁盔带护颊护颈，札甲一直披到大腿，扛一面齐胸高的大橹盾，像一堵墙；楚卒短褐裹腿、皮帽插一根长雉翎，小圆盾、长戟，身形轻快。</span></figcaption></figure>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
(() => {

  // ---------- 三套楚汉兵卒造型（同一副骨架：上身、胯、头、两节腿、两节胳膊、矛、盾） ----------
