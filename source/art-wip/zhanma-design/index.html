<title>四级斩马刀手造型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* 审批台 082：兵和卒要重新设计，楚汉步兵造型不一样。三套方案，同一副骨架（加了膝、肘），都能直接套进对打动画 */
:root{--bg:#1b1a17;--fg:#f0e7d2;--dim:#a39b89;--line:#3a362f;--red:#c8432f;
  --ef:"Noto Serif SC","Songti SC",serif;--es:"Noto Sans SC","PingFang SC",sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--es);padding-block:28px 56px;padding-inline:16px;margin:0}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font:900 30px/1.2 var(--ef);letter-spacing:.14em;text-wrap:balance}
.lead{margin:0;color:var(--dim);font-size:14px;line-height:1.8;max-width:74ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
canvas{width:100%;max-width:100%;aspect-ratio:4/3;display:block;background:#2b2722;box-shadow:0 0 0 1px var(--line)}
figcaption b{display:block;font:900 20px/1.3 var(--ef);letter-spacing:.12em}
figcaption span{font-size:14px;line-height:1.75}
.tag{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;padding-inline:6px}
button{all:unset;cursor:pointer;border:1.5px solid var(--fg);padding:6px 14px;font:600 14px var(--ef);letter-spacing:.1em;align-self:flex-start}
button.on{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
</style>
<div class="wrap">
  <h1>四级金甲斩马刀手 · 三套</h1>
  <p class="lead">兵卒对打用保底版（乙「盔胄对巾帻」5.6 秒）。四级兵照乙的剪影走，换成金甲、拿斩马刀。三套，每套左边汉兵、右边楚卒，原地慢慢转着看。</p>
  <button id="spin" class="on">转动中</button>
  <div class="grid">
    <figure><canvas id="cv_a"></canvas><div class="tag"><span>汉兵</span><span>楚卒</span></div><figcaption><b>甲 · 通身金甲</b><span>乙的剪影不变，一身换成金札甲；汉兵金盔红缨、金边红盾，楚卒黑巾金额箍、金甲背心、黑圆盾镶金边。</span></figcaption></figure>
    <figure><canvas id="cv_b"></canvas><div class="tag"><span>汉兵</span><span>楚卒</span></div><figcaption><b>乙 · 黑甲金边</b><span>甲片黑漆，金只做甲缘、盔、护肩和刀上一道金线，收着用金。</span></figcaption></figure>
    <figure><canvas id="cv_c"></canvas><div class="tag"><span>汉兵</span><span>楚卒</span></div><figcaption><b>丙 · 重装金甲 + 披风</b><span>加披膊、护颈、及膝披风（汉红、楚黑），刀刃更长，剪影大一圈。</span></figcaption></figure>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
(() => {
  const PI = Math.PI, V = (x, y, z) => new THREE.Vector3(x, y, z);
  // ---------- 零件（照游戏里 spear 兵；身子拆成上身 / 胯，腿、胳膊各两节） ----------
  const SIDE = { r: { cloth: 0xa8321f, cloth2: 0xc4553a, armor: 0x4d4541, trim: 0xc9a045, tassel: 0xc0412c }, b: { cloth: 0x2a292c, cloth2: 0x48464a, armor: 0x2f2e31, trim: 0x9c8a62, tassel: 0x7a2418 } };
  const C = { skin: 0xd8bf98, pants: 0x2d2a27, wood: 0x6e4a2c, metal: 0xb8b4aa, dark: 0x1d1c1b, hair: 0x151413 };
  const G = { box: (w, h, d) => new THREE.BoxGeometry(w, h, d), cyl: (a, b, h, s = 8) => new THREE.CylinderGeometry(a, b, h, s), sph: (r, s = 8) => new THREE.SphereGeometry(r, s, Math.max(4, s - 2)), cone: (r, h, s = 8) => new THREE.ConeGeometry(r, h, s) };
  const M4 = (x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => new THREE.Matrix4().compose(V(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V(sx, sy, sz));

  function mk(parts, piv) {

      const c = new THREE.Color(p.color), a = g.attributes.position, n = g.attributes.normal;

  const grad = (() => { const t = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 235, 235, 235, 255]), 3, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
  const vcMat = new THREE.MeshToonMaterial({ color: 0xffffff, vertexColors: true, gradientMap: grad });

  // ---------- 骨架：上身、胯按关节值摆；腿、胳膊两节反解去够脚、手的目标 ----------
  const L_TH = 0.4, L_SH = 0.43, L_UA = 0.25, L_FA = 0.24;

    const y = yAxis.clone().normalize(), x = new THREE.Vector3().crossVectors(y, zHint).normalize(); if (x.lengthSq() < 1e-6) x.set(1, 0, 0);

    constructor(geos) {

      for (const k in geos) { const g = inked(geos[k]); g.matrixAutoUpdate = false; this.root.add(g); this.p[k] = g; }
    }
    // S：px 沿交锋线往前、side 往盾那边为负、py 起跳；crouch、lean 前倾、twist 拧腰（往盾那边为正）、sway 侧歪；
    //    fL / fR 两脚在交锋线上的位置、liftL / liftR 抬脚；wp 握矛的手、wd 矛的朝向 [左右, 俯仰]、g 手离矛根多远；sp 盾心、sd 盾面朝向；hx 低头、hy 转头；fall 下半身倒地
    pose(S) {

      _e.set(S.lean * 0.35, S.twist * 0.3, S.sway * 0.4, 'YXZ'); const pel = new THREE.Matrix4().compose(pelvisPos, _q.setFromEuler(_e), V(1, 1, 1));
      if (S.fall) { const f = new THREE.Matrix4().makeTranslation(S.side, 0, S.px).multiply(new THREE.Matrix4().makeRotationX(-S.fall * 1.5)).multiply(new THREE.Matrix4().makeTranslation(-S.side, 0, -S.px)); pel.premultiply(f); }
      M.pelvis = pel;
      _e.set(S.lean * 0.65, S.twist * 0.7, S.sway * 0.6, 'YXZ'); const up = pel.clone().multiply(new THREE.Matrix4().compose(V(0, 0.08, 0), _q.setFromEuler(_e), V(1, 1, 1)));

      M.head = up.clone().multiply(new THREE.Matrix4().compose(V(0, 0.52, 0), _q.setFromEuler(_e.set(S.hx, S.hy, 0, 'YXZ')), V(1, 1, 1)));

      }

      const fwdU = V(0, 0, 1).transformDirection(up);
      const sh = { W: V(0.27, 0.44, 0).applyMatrix4(up), S: V(-0.27, 0.44, 0).applyMatrix4(up) };
      const body = V(S.side, S.py, S.px);   // 手、盾的目标是相对身子写的：跟着人一起往前走、往旁边闪、往上跳
      const [elW, hW] = ik2(sh.W, V(...S.wp).add(body), L_UA, L_FA, V(0.6, -1, -0.5));
      M.uarmW = frame(sh.W, sh.W.clone().sub(elW), fwdU); M.farmW = frame(elW, elW.clone().sub(hW), fwdU);
      const wdir = dirOf(S.wd[0], S.wd[1]);

      { // 矛根别扎进自己肚子：矛杆往回要穿过身子时，手顺着矛杆往矛根滑
        const ta = V(0, 0, 0).applyMatrix4(pel), tb = V(0, 0.5, 0).applyMatrix4(up), ab = tb.clone().sub(ta), L2 = ab.lengthSq();

      const n = dirOf(S.sd[0], S.sd[1]), sc = V(...S.sp).add(body), want = sc.clone().addScaledVector(n, -0.07);
      const [elS, hS] = ik2(sh.S, want, L_UA, L_FA, V(-0.6, -1, -0.4));
      M.uarmS = frame(sh.S, sh.S.clone().sub(elS), fwdU); M.farmS = frame(elS, elS.clone().sub(hS), fwdU);
      const shC = hS.clone().addScaledVector(n, 0.07), upS = V(0, 1, 0).addScaledVector(n, -n.y).normalize();

    }
  }
  // ---------- 三套楚汉兵卒造型（同一副骨架：上身、胯、头、两节腿、两节胳膊、矛、盾） ----------
  const K = { skin: 0xd8bf98, hair: 0x151413, iron: 0x55524d, bronze: 0x9a7a3c, wood: 0x6e4a2c, metal: 0xc4c0b6, black: 0x242226, boot: 0x1d1c1b };
  const HAN = { red: 0xa8321f, red2: 0x7e2216, lac: 0x2a2626, cord: 0x8e2a1a, pants: 0x3a2e2a, gold: 0xc9a045 };
  const CHU = { robe: 0x262428, robe2: 0x3b2a2e, lac: 0x6e2a1c, ochre: 0xc69a3c, feather: 0xe8e0cc, pants: 0x2a2629, jade: 0x6f9a86 };
  const lamellar = (w, h, d, y0, rows, c1, c2, z = 0) => { const a = []; for (let i = 0; i < rows; i++) { const y = y0 + i * h / rows; a.push(P(G.box(w, h / rows * 0.78, d), c1, 0, y + h / rows / 2, z), P(G.box(w * 1.01, h / rows * 0.18, d * 1.01), c2, 0, y + h / rows * 0.95, z)); } return a; };
  function legs(o, pants, boot, wrap) {
    for (const k of ['L', 'R']) {

      const sh = [P(G.sph(0.075, 6), pants, 0, 0, 0), P(G.box(0.13, 0.38, 0.15), pants, 0, -0.19, 0), P(G.box(0.16, 0.1, 0.26), boot, 0, -0.41, 0.05)];

  // ---------- 四级金甲斩马刀手：照保底版乙「盔胄对巾帻」的路子，三套（Ham char-002 定保底、char-009「回备选方案」）----------
  const GD = 0xd6a43e, GD2 = 0xf3d27a, GD3 = 0xa8792a;

  const DESIGNS = {
    a: {

      han() { const o = {};
