<title>棋子升级特效</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* 四段循环小片排成两列；每段下面写它是什么、好在哪、要注意什么 */
:root{--bg:#1b1a17;--fg:#f0e7d2;--dim:#a39b89;--line:#3a362f;--red:#c8432f;
  --ef:"Noto Serif SC","Songti SC",serif;--es:"Noto Sans SC","PingFang SC",sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--es);padding-block:28px 56px;padding-inline:16px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font:900 30px/1.2 var(--ef);letter-spacing:.14em;text-wrap:balance}
.lead{margin:0;color:var(--dim);font-size:14px;line-height:1.8;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:22px}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
video{width:100%;max-width:100%;aspect-ratio:4/3;background:#000;display:block;box-shadow:0 0 0 1px var(--line)}
figcaption{display:flex;flex-direction:column;gap:4px}
figcaption b{font:900 20px/1.3 var(--ef);letter-spacing:.12em}
figcaption b i{font-style:normal;color:var(--red);margin-right:.4em}
figcaption span{font-size:14px;line-height:1.7;color:var(--fg)}
figcaption small{font-size:13px;line-height:1.6;color:var(--dim)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl button{all:unset;cursor:pointer;border:1.5px solid var(--fg);padding:6px 14px;font:600 14px var(--ef);letter-spacing:.1em}
.ctl button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.ctl button.on{background:var(--fg);color:var(--bg)}
</style>
<div class="wrap">
  <h1>棋子升级 · 变身特效</h1>
  <p class="lead">以一枚汉兵从一级木棋子升到二级银棋子为例，四个方案都是在真实对局里拍的。每段约一秒半，循环播放。升金（三级）、升玉（四级）用同一套动作，只把光的颜色换成金色、玉白色。</p>
  <div class="ctl" role="group" aria-label="播放速度"><button data-r="1" class="on">正常速度</button><button data-r="0.35">慢放</button></div>
  <div class="grid">
    <figure><video src="melt.mp4" poster="melt_poster.jpg" autoplay muted loop playsinline></video>
      <figcaption><b><i>甲</i>熔铸</b><span>一圈熔金从底边往上扫过，扫过的地方就变成银的，边上溅火星；扫到顶后整颗亮一下。</span><small>像回炉重铸，变化过程看得最清楚；棋子不动，不挡别的子。</small></figcaption></figure>
    <figure><video src="flip.mp4" poster="flip_poster.jpg" autoplay muted loop playsinline></video>
      <figcaption><b><i>乙</i>翻面</b><span>棋子跳起来翻个身，落下时已经是银的，落地荡开一圈尘、一道光。</span><small>动作最干脆、最有手感；翻到半空那一下看不清新材质。</small></figcaption></figure>
    <figure><video src="shell.mp4" poster="shell_poster.jpg" autoplay muted loop playsinline></video>
      <figcaption><b><i>丙</i>破壳</b><span>木面先裂出几道发光的缝，接着木壳炸开、碎片飞散，里面露出银棋子，一下闪光。</span><small>最有冲击力，像「脱胎换骨」；碎片会飞到旁边的格子上一下。</small></figcaption></figure>
    <figure><video src="beam.mp4" poster="beam_poster.jpg" autoplay muted loop playsinline></video>
      <figcaption><b><i>丁</i>光柱</b><span>一道光柱从天而降罩住棋子，棋子在光里浮起、转一圈，光散了就换成银的，字面上再掠过一道亮光。</span><small>最有仪式感；时间稍长，光最亮那一下会盖住周围。</small></figcaption></figure>
  </div>
</div>
<script>
document.querySelectorAll('.ctl button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.ctl button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('video').forEach(v => { v.playbackRate = +b.dataset.r; v.play().catch(() => {}); });
});
</script>
